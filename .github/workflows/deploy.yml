name: EventLive MVP Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EVENTLIVE_PUBLIC_BASE_URL: https://eventme.live/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci || npm install

      - name: Restore event image cache
        uses: actions/cache@v4
        with:
          path: dist/assets/event-images
          key: eventlive-event-images-${{ runner.os }}-${{ hashFiles('data/event_image_cache_manifest.json') }}
          restore-keys: |
            eventlive-event-images-${{ runner.os }}-

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Run validation regression tests
        run: npm run test:validation

      - name: Run CSV parser regression tests
        run: npm run test:csv

      - name: Run event-kind regression tests (live vs ongoing programs)
        run: npm run test:event-kind

      - name: Run release verdict regression tests
        run: npm run test:release-verdict

      - name: Run release verdict schema suite (positive + fail-closed negatives)
        run: npm run test:release-verdict-schema-suite

      - name: Restore schema suite runtime history cache
        uses: actions/cache/restore@v4
        with:
          path: ops/schema-suite-runtime-history.json
          key: schema-suite-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            schema-suite-history-${{ github.ref_name }}-

      - name: Evaluate schema suite runtime regression trend (consecutive-run warning)
        run: npm run test:release-verdict-schema-regression

      - name: Publish schema runtime regression summary
        id: schema_regression_summary
        run: npm run report:release-verdict-schema-regression

      - name: Save schema suite runtime history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ops/schema-suite-runtime-history.json
          key: schema-suite-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Validate data (with gate)
        run: npm run validate:gate

      - name: Build EventLive public site
        run: npm run build

      - name: Verify search and AI discovery contracts
        run: |
          npm run test:sitemap
          npm run test:seo-structured-data
          npm run test:seo-content
          npm run test:seo-freshness
          npm run test:indexnow
          npm run test:ai-search-readiness

      - name: Verify public asset links (no broken event links ship to production)
        run: npm run test:public-assets

      - name: Verify PDF poster crop identity gate (WO-5, no positional image mis-binding)
        run: npm run test:visit-saudi-image-identity

      - name: Verify owner-only surface isolation (no operational pages leak to the public)
        run: npm run test:owner-surface-isolation

      - name: Verify unified attendance-priority ordering (first day leads, ongoing yields)
        run: npm run test:event-priority

      - name: Verify homepage this-month section + calendar strip (WO-2)
        run: npm run test:home-month-calendar

      - name: Verify multi-day visibility on every event card (WO-7)
        run: npm run test:multiday-card

      - name: Verify event detail page reorganization (WO-6, section order/single-occurrence/sticky bar)
        run: npm run test:event-page-reorg

      - name: Verify first-glance trust gate (no dead live elements ship)
        run: npm run test:first-glance-trust

      - name: Verify mobile touch targets and viewport budgets (WO-1 review gap, ~10s)
        run: npm run test:mobile-browsing

      - name: Verify bilingual site contract
        run: |
          npm run test:i18n-contract
          npm run test:i18n-site
          npm run test:en-surface-sweep

      - name: Run verified venue location regression tests
        run: npm run test:venue-location

      - name: Run source publication identity regression tests
        run: |
          npm run test:source-action-identity
          npm run test:eye-official-links
          npm run test:hrse-agenda-enrichment
          npm run test:smart-data-agenda-enrichment
          npm run test:rff-agenda-enrichment
          npm run test:official-agenda-radar
          npm run test:global-proptech-agenda

      - name: Run static analysis audit
        run: npm run audit:static

      - name: Run product journey audit
        run: npm run audit:product-journeys

      - name: Run UI state audit
        run: npm run audit:ui-states

      - name: Run content localization audit
        run: npm run audit:content-localization

      - name: Run compliance and source-rights audit
        run: npm run audit:compliance-source-rights

      - name: Run documentation audit
        run: npm run audit:documentation

      - name: Run secret and environment audit
        run: npm run audit:secret-env

      - name: Run production dependency audit
        run: npm run audit:dependencies

      - name: Run web quality audit
        run: npm run audit:web-quality

      - name: Run Lighthouse performance audit
        run: npm run audit:lighthouse

      - name: Run browser matrix audit
        run: npm run audit:browser-matrix

      - name: Run axe accessibility audit
        run: npm run audit:axe

      - name: Run security review audit
        run: npm run audit:security-review

      - name: Run operations readiness audit
        run: npm run audit:ops-readiness

      - name: Run release deploy rollback audit
        run: npm run audit:release-deploy-rollback

      - name: Build applied delivery readiness standard
        run: npm run readiness:standard

      - name: Build owner command center evidence
        run: npm run owner:command-center

      - name: Run owner command center regression tests
        run: npm run test:owner-command-center

      - name: Run analytics instrumentation regression tests
        run: npm run test:analytics

      - name: Run static analysis regression tests
        run: npm run test:static

      - name: Run product journey regression tests
        run: npm run test:product-journeys

      - name: Run UI state regression tests
        run: npm run test:ui-states

      - name: Run content localization regression tests
        run: npm run test:content-localization

      - name: Run compliance and source-rights regression tests
        run: npm run test:compliance-source-rights

      - name: Run documentation regression tests
        run: npm run test:documentation

      - name: Run secret and environment regression tests
        run: npm run test:secret-env

      - name: Run web quality audit regression tests
        run: npm run test:web-quality

      - name: Run Lighthouse performance regression tests
        run: npm run test:lighthouse

      - name: Run browser matrix regression tests
        run: npm run test:browser-matrix

      - name: Run axe accessibility regression tests
        run: npm run test:axe

      - name: Run security review regression tests
        run: npm run test:security-review

      - name: Run operations readiness regression tests
        run: npm run test:ops-readiness

      - name: Run release deploy rollback regression tests
        run: npm run test:release-deploy-rollback

      - name: Run applied delivery readiness standard regression tests
        run: npm run test:readiness-standard

      - name: Upload CI evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            reports/*.md
            reports/*.json
            dist/**
            data/schema.json
            ops/schema-suite-runtime-history.json

      - name: Upload search discovery payload
        uses: actions/upload-artifact@v4
        with:
          name: eventlive-search-discovery-${{ github.run_id }}
          retention-days: 2
          if-no-files-found: error
          path: |
            .eventlive-cache/indexnow-delta.json
            dist/sitemap.xml

      - name: Create status summary
        run: |
          echo "## EventLive Status Report" >> $GITHUB_STEP_SUMMARY
          echo "- Result: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY
          echo "- Site (after deploy): ${EVENTLIVE_PUBLIC_BASE_URL}" >> $GITHUB_STEP_SUMMARY
          echo "- Live site metadata: dist/current-live-site.json" >> $GITHUB_STEP_SUMMARY
          echo "- Schema regression status: ${{ steps.schema_regression_summary.outputs.schema_regression_status || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Schema regression policy: ${{ steps.schema_regression_summary.outputs.schema_regression_policy_mode || 'n/a' }} (branch: ${{ steps.schema_regression_summary.outputs.schema_regression_branch_name || 'n/a' }})" >> $GITHUB_STEP_SUMMARY
          echo "- Schema regression samples: ${{ steps.schema_regression_summary.outputs.schema_regression_samples_progress || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Schema regression consecutive: ${{ steps.schema_regression_summary.outputs.schema_regression_consecutive || 'n/a' }}" >> $GITHUB_STEP_SUMMARY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-release:
    runs-on: ubuntu-latest
    needs: deploy
    env:
      EVENTLIVE_PUBLIC_BASE_URL: https://eventme.live/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci || npm install

      - name: Download search discovery payload
        uses: actions/download-artifact@v4
        with:
          name: eventlive-search-discovery-${{ github.run_id }}
          path: .

      - name: Notify IndexNow after the new site is live
        continue-on-error: true
        run: npm run seo:indexnow:all

      - name: Restore schema suite runtime history cache
        uses: actions/cache/restore@v4
        with:
          path: ops/schema-suite-runtime-history.json
          key: schema-suite-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            schema-suite-history-${{ github.ref_name }}-

      - name: Run release verdict schema suite (post-deploy evidence continuity)
        run: npm run test:release-verdict-schema-suite

      - name: Evaluate schema suite runtime regression trend (post-deploy)
        run: npm run test:release-verdict-schema-regression

      - name: Publish schema runtime regression summary (post-deploy)
        id: schema_regression_summary_verify
        run: npm run report:release-verdict-schema-regression

      - name: Save schema suite runtime history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ops/schema-suite-runtime-history.json
          key: schema-suite-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Run post-deploy uptime check (retry x3)
        id: uptime
        continue-on-error: true
        env:
          EVENTLIVE_MARKER: EventLive
        run: |
          attempts=3
          used_attempt=0
          for attempt in $(seq 1 $attempts); do
            used_attempt=$attempt
            echo "[uptime] attempt ${attempt}/${attempts}"
            if npm run uptime:check; then
              echo "[uptime] success on attempt ${attempt}"
              echo "attempts_used=${used_attempt}" >> "$GITHUB_OUTPUT"
              if [ "$used_attempt" -eq 1 ]; then
                echo "result_mode=first-pass" >> "$GITHUB_OUTPUT"
              else
                echo "result_mode=recovered-after-retry" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "[uptime] transient failure, retrying in 20s..."
              sleep 20
            fi
          done
          echo "attempts_used=${used_attempt}" >> "$GITHUB_OUTPUT"
          echo "result_mode=failed-after-retries" >> "$GITHUB_OUTPUT"
          echo "[uptime] failed after ${attempts} attempts"
          exit 1

      - name: Run post-deploy stability check (retry x3)
        id: stability
        continue-on-error: true
        env:
          EVENTLIVE_MARKER: EventLive
          LATENCY_WARN_MS: 1200
          LATENCY_FAIL_MS: 2500
        run: |
          attempts=3
          used_attempt=0
          for attempt in $(seq 1 $attempts); do
            used_attempt=$attempt
            echo "[stability] attempt ${attempt}/${attempts}"
            if npm run stability:check; then
              echo "[stability] success on attempt ${attempt}"
              echo "attempts_used=${used_attempt}" >> "$GITHUB_OUTPUT"
              if [ "$used_attempt" -eq 1 ]; then
                echo "result_mode=first-pass" >> "$GITHUB_OUTPUT"
              else
                echo "result_mode=recovered-after-retry" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "[stability] transient failure, retrying in 30s..."
              sleep 30
            fi
          done
          echo "attempts_used=${used_attempt}" >> "$GITHUB_OUTPUT"
          echo "result_mode=failed-after-retries" >> "$GITHUB_OUTPUT"
          echo "[stability] failed after ${attempts} attempts"
          exit 1

      - name: Generate reliability rollup report
        if: always()
        env:
          ROLLUP_WINDOW_DAYS: 7
          MIN_SUCCESS_RATE_PCT: 99
          MAX_FAIL_RATE_PCT: 1
          UPTIME_OUTCOME: ${{ steps.uptime.outcome }}
          UPTIME_ATTEMPTS_USED: ${{ steps.uptime.outputs.attempts_used }}
          UPTIME_RESULT_MODE: ${{ steps.uptime.outputs.result_mode }}
          STABILITY_OUTCOME: ${{ steps.stability.outcome }}
          STABILITY_ATTEMPTS_USED: ${{ steps.stability.outputs.attempts_used }}
          STABILITY_RESULT_MODE: ${{ steps.stability.outputs.result_mode }}
        run: npm run reliability:rollup

      - name: Enforce rolling SLO policy gate
        id: slo_gate
        continue-on-error: true
        env:
          SLO_MIN_SAMPLES: 8
        run: npm run reliability:slo-gate

      - name: Enforce protected-branch schema regression gate
        id: schema_regression_gate
        continue-on-error: true
        env:
          SCHEMA_REGRESSION_STATUS: ${{ steps.schema_regression_summary_verify.outputs.schema_regression_status || 'n/a' }}
          SCHEMA_REGRESSION_POLICY_MODE: ${{ steps.schema_regression_summary_verify.outputs.schema_regression_policy_mode || 'n/a' }}
          SCHEMA_REGRESSION_BRANCH_NAME: ${{ steps.schema_regression_summary_verify.outputs.schema_regression_branch_name || 'n/a' }}
          SCHEMA_REGRESSION_OVERRIDE: ${{ vars.SCHEMA_REGRESSION_OVERRIDE || '0' }}
          SCHEMA_REGRESSION_OVERRIDE_INCIDENT: ${{ vars.SCHEMA_REGRESSION_OVERRIDE_INCIDENT || '' }}
        run: |
          echo "policy=${SCHEMA_REGRESSION_POLICY_MODE} branch=${SCHEMA_REGRESSION_BRANCH_NAME} status=${SCHEMA_REGRESSION_STATUS} override=${SCHEMA_REGRESSION_OVERRIDE} incident=${SCHEMA_REGRESSION_OVERRIDE_INCIDENT:-none}"
          if [ "${SCHEMA_REGRESSION_POLICY_MODE}" = "STRICT_PROTECTED" ] && [ "${SCHEMA_REGRESSION_STATUS}" = "WARN" ] && [ "${SCHEMA_REGRESSION_OVERRIDE}" != "1" ]; then
            echo "decision=BLOCK" >> "$GITHUB_OUTPUT"
            echo "SCHEMA_REGRESSION_GATE_BLOCK protected-branch regression warning without override"
            exit 1
          fi
          if [ "${SCHEMA_REGRESSION_POLICY_MODE}" = "STRICT_PROTECTED" ] && [ "${SCHEMA_REGRESSION_STATUS}" = "WARN" ] && [ "${SCHEMA_REGRESSION_OVERRIDE}" = "1" ]; then
            if [[ -z "${SCHEMA_REGRESSION_OVERRIDE_INCIDENT}" || ! "${SCHEMA_REGRESSION_OVERRIDE_INCIDENT}" =~ ^INC-[0-9]{3,}$ ]]; then
              echo "decision=BLOCK_INVALID_OVERRIDE_EVIDENCE" >> "$GITHUB_OUTPUT"
              echo "SCHEMA_REGRESSION_GATE_BLOCK override enabled but incident evidence missing/invalid (expected INC-###...)"
              exit 1
            fi
            echo "decision=OVERRIDDEN" >> "$GITHUB_OUTPUT"
            echo "SCHEMA_REGRESSION_GATE_OVERRIDE active with incident ${SCHEMA_REGRESSION_OVERRIDE_INCIDENT}"
            exit 0
          fi
          echo "decision=PASS" >> "$GITHUB_OUTPUT"
          echo "SCHEMA_REGRESSION_GATE_PASS"

      - name: Upload release verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            03-Reports/stability-24h-log.md
            04-Incidents/*.md
            reports/reliability-rollup.md
            reports/schema-suite-regression-status.md
            reports/schema-suite-regression-status.json
            reports/schema-suite-timing.md
            reports/indexnow-submission-receipt.json
            ops/schema-suite-runtime-history.json

      - name: Compute release safety verdict
        if: always()
        id: release_verdict
        env:
          UPTIME_OUTCOME: ${{ steps.uptime.outcome }}
          STABILITY_OUTCOME: ${{ steps.stability.outcome }}
          SLO_OUTCOME: ${{ steps.slo_gate.outcome }}
          SLO_ENFORCEMENT_STATE: ${{ steps.slo_gate.outputs.enforcement_state || 'n/a' }}
          RELEASE_VERDICT_VALIDATE_SCHEMA: '1'
        run: npm run release:verdict

      - name: Create release scorecard summary
        if: always()
        run: |
          echo "## EventLive Release Scorecard" >> $GITHUB_STEP_SUMMARY
          echo "- Deploy URL: ${EVENTLIVE_PUBLIC_BASE_URL}" >> $GITHUB_STEP_SUMMARY
          echo "- Release safety verdict: ${{ steps.release_verdict.outputs.verdict || 'ATTENTION' }} (${{ steps.release_verdict.outputs.verdict_reason || 'verdict unavailable' }})" >> $GITHUB_STEP_SUMMARY
          echo "- Uptime check outcome: ${{ steps.uptime.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Uptime attempts used: ${{ steps.uptime.outputs.attempts_used || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Uptime result mode: ${{ steps.uptime.outputs.result_mode || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Stability check outcome: ${{ steps.stability.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Stability attempts used: ${{ steps.stability.outputs.attempts_used || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Stability result mode: ${{ steps.stability.outputs.result_mode || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Reliability rollup: reports/reliability-rollup.md (7-day window)" >> $GITHUB_STEP_SUMMARY
          echo "- Schema regression status: ${{ steps.schema_regression_summary_verify.outputs.schema_regression_status || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Schema regression policy: ${{ steps.schema_regression_summary_verify.outputs.schema_regression_policy_mode || 'n/a' }} (branch: ${{ steps.schema_regression_summary_verify.outputs.schema_regression_branch_name || 'n/a' }})" >> $GITHUB_STEP_SUMMARY
          echo "- Schema regression samples: ${{ steps.schema_regression_summary_verify.outputs.schema_regression_samples_progress || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Schema regression consecutive: ${{ steps.schema_regression_summary_verify.outputs.schema_regression_consecutive || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Schema regression gate decision: ${{ steps.schema_regression_gate.outputs.decision || 'n/a' }} (outcome: ${{ steps.schema_regression_gate.outcome || 'n/a' }})" >> $GITHUB_STEP_SUMMARY
          echo "- Schema regression override flag: ${{ vars.SCHEMA_REGRESSION_OVERRIDE || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Schema regression override incident: ${{ vars.SCHEMA_REGRESSION_OVERRIDE_INCIDENT || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "- SLO policy gate outcome: ${{ steps.slo_gate.outputs.policy_state || steps.slo_gate.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- SLO enforcement mode: ${{ steps.slo_gate.outputs.enforcement_state || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "- SLO policy hint: ${{ steps.slo_gate.outputs.enforcement_state == 'ACTIVE' && 'blocking gate active' || 'warm-up mode (non-blocking until sample minimum)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- SLO sample progress: ${{ steps.slo_gate.outputs.samples_progress || 'n/a' }} (min required: ${{ steps.slo_gate.outputs.samples_min || '8' }})" >> $GITHUB_STEP_SUMMARY
          echo "- Evidence artifact: release-verification-${{ github.run_id }} (14 days)" >> $GITHUB_STEP_SUMMARY

      - name: Fail if release verification checks failed
        if: ${{ steps.uptime.outcome != 'success' || steps.stability.outcome != 'success' || steps.slo_gate.outcome != 'success' || steps.schema_regression_gate.outcome != 'success' }}
        run: |
          echo "Release verification failed (uptime=${{ steps.uptime.outcome }}, stability=${{ steps.stability.outcome }}, slo_gate=${{ steps.slo_gate.outcome }}, schema_regression_gate=${{ steps.schema_regression_gate.outcome }})"
          exit 1
