name: EventLive Uptime Check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  uptime:
    runs-on: ubuntu-latest
    env:
      EVENTLIVE_PUBLIC_BASE_URL: https://eventme.live/
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run uptime check
        env:
          EVENTLIVE_MARKER: EventLive
        run: npm run uptime:check
