# Freshness is the time of a successful Pages publish, not whole-run success:
# Source Sync deliberately finishes red for quality/security debt after deploy.
name: EventLive Sync Freshness Watchdog

on:
  schedule:
    # Away from Source Sync's daily slot; GitHub can delay scheduled runs.
    - cron: '43 11 * * *'
    - cron: '43 19 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Serialize scheduled and manual checks, so they cannot independently dispatch
# the same catch-up while reading the same stale publication evidence.
concurrency:
  group: eventme-sync-freshness-watchdog
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check how long since the catalog was last published
        uses: actions/github-script@v8
        env:
          SYNC_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const { checkSyncFreshness } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/sync-freshness-watchdog.mjs`);
            await checkSyncFreshness({
              github, context, core, branch: process.env.SYNC_BRANCH,
              // Preserve the existing 26h catch-up / 40h outage alarm policy.
              catchupHours: 26, alarmHours: 40, cooldownHours: 6
            });
