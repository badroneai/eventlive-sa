name: EventLive Source Sync

on:
  schedule:
    # Once a day at 02:17 UTC = 05:17 Riyadh (KSA is UTC+3 year-round, no DST).
    #
    # Was every 6 hours. Owner call 2026-09-02: four collections a day buy very
    # little now that the source set is mature — measured over 128 runs, the
    # productive sources are already visited on every run regardless of cadence
    # (scripts/source-cadence-utils.mjs gives them interval 0), and the deferred
    # ones wait on WALL-CLOCK cooldowns of 24/72/168 hours, so daily runs do not
    # reduce anyone's coverage.
    #
    # Why this hour, from 120 measured runs:
    #   * Runner contention. Median run duration by UTC hour: 02:xx = 22.3 min
    #     (the quietest window with a real sample), against 31.5 min at 19:xx and
    #     36 min at 16:xx/20:xx. Contention is not just slowness — a crowded
    #     runner is what produced the false-red Lighthouse sample on 2026-09-02
    #     (min_perf=67 against 100 for the same commit 41 minutes earlier).
    #   * Coverage of the Saudi day. Saudi organisations publish during working
    #     hours; a 05:17 run carries everything posted through the previous full
    #     working day and evening, and the site is fresh before the next one
    #     starts.
    #   * Failure headroom. A run that fails at 05:17 leaves a whole working day
    #     to notice and re-dispatch it. An evening failure sits overnight.
    #
    # The live board no longer depends on this interval: cards carry their own
    # window and the page retires them at runtime (scripts/home-board-live.mjs),
    # so a longer gap between publishes can no longer leave an ended event
    # labelled "مباشر الآن".
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  # contents: write is required to persist the synced catalog/candidates back to the repo;
  # without it every published event lives only until the next sync run.
  contents: write
  pages: write
  id-token: write
  # issues: write powers the autonomous surface-debt alert — the sync opens,
  # updates, and closes its own GitHub issue instead of anyone polling reports.
  issues: write

concurrency:
  group: eventme-source-sync
  cancel-in-progress: false

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    env:
      EVENTLIVE_PUBLIC_BASE_URL: https://eventme.live/
      EVENTLIVE_SOURCE_COLLECT_ENDED_EVENTS: "false"
      EVENTLIVE_SOURCE_ADAPTIVE_CADENCE: "true"
      EVENTLIVE_SOURCE_DIAGNOSTICS_INTERVAL_HOURS: "24"
      EVENTLIVE_INCLUDE_DISCOVERY_RADARS: "false"
      EVENTLIVE_SOURCE_FETCH_TIMEOUT_MS: "12000"
      EVENTLIVE_SOURCE_FETCH_ATTEMPTS: "2"
      EVENTLIVE_BROWSER_TIMEOUT_MS: "30000"
      EVENTLIVE_LIVE_BROWSER_TIMEOUT_MS: "30000"
      EVENTLIVE_BROWSER_FAILURE_COOLDOWN_MS: "259200000"
      EVENTLIVE_TRUSTED_SOURCE_LIMIT: "200"
      EVENTLIVE_MAX_SOURCE_COLLECTOR_ERRORS: "12"
      EVENTLIVE_CRITICAL_SOURCE_PRIORITY_MAX: "10"
      EVENTLIVE_CRITICAL_SOURCE_ERROR_STREAK: "2"
      EVENTLIVE_MAX_CRITICAL_SOURCE_ERRORS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Restore event image cache
        uses: actions/cache@v5
        with:
          path: dist/assets/event-images
          key: eventlive-event-images-${{ runner.os }}-${{ hashFiles('data/event_image_cache_manifest.json') }}
          restore-keys: |
            eventlive-event-images-${{ runner.os }}-

      - name: Restore incremental site cache
        uses: actions/cache@v5
        with:
          path: |
            dist/events
            dist/en
            dist/cities
            dist/categories
            dist/for
            dist/feeds
            dist/assets/event-covers
            dist/.eventlive-build-state.json
          key: eventlive-static-site-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            eventlive-static-site-${{ runner.os }}-

      - name: Install Playwright browsers
        # webkit is not optional here: this workflow now runs the shared
        # publish-quality battery (ci:publish-quality-gates), and
        # audit:browser-matrix exercises webkit. With chromium alone it does
        # not skip that engine — it fails on a missing binary, and
        # audit:ops-readiness fails on top of it because it reads the
        # browser-matrix report. Kept in lockstep with deploy.yml's install
        # step and asserted by test:publish-gate-drift.
        run: npx playwright install --with-deps chromium webkit

      - name: Install source document extractors
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ara poppler-utils

      - name: Source state preflight
        run: |
          npm run test:source-health-gate
          npm run test:source-run-state
          npm run test:source-future-only
          npm run test:source-cadence
          npm run test:source-extractors
          npm run test:source-collection-delta
          npm run test:source-sync-workflow
          npm run test:incremental-build

      - name: Collect trusted sources and publish catalog
        env:
          # Optional Saudi egress for geo-restricted government origins
          # (scripts/ksa-egress.mjs). Absent by default: the flagged sources
          # then fail honestly and are reported as chronically dead rather than
          # silently skipped. Set the repository secret to switch them back on
          # without any code change.
          EVENTLIVE_KSA_EGRESS_PROXY: ${{ secrets.EVENTLIVE_KSA_EGRESS_PROXY }}
        run: npm run sources:sync

      - name: Setup Python for autonomous content translation
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache Argos translation models
        uses: actions/cache@v5
        with:
          path: ~/.local/share/argos-translate
          # v2: the v1 cache was created from a run whose pending backlog was
          # en->ar only, so it never contained the ar->en model and every
          # English-side row skipped silently. The new key lets the fixed
          # pair-aware installer download and persist BOTH directions.
          key: argos-translate-models-both-directions-v2
          restore-keys: |
            argos-translate-models-

      - name: Install Argos Translate (open-source offline MT, no keys)
        run: pip install --quiet argostranslate

      - name: Translate new catalog content (autonomous, plan T7.1)
        run: npm run translate:catalog

      - name: Regression checks
        run: |
          npm run validate:gate
          npm run test:validation
          npm run test:csv
          npm run test:source-auto-publish
          npm run test:source-auto-publish-semantic
          npm run test:source-auto-publish-fuzzy-dedupe
          npm run test:source-growth
          npm run test:source-health-gate
          npm run test:source-action-identity
          npm run test:eye-official-links
          npm run test:source-sync-pipeline
          npm run test:source-sync-workflow
          npm run test:source-browser-probe
          npm run test:ksa-egress
          npm run test:bot-challenge-detection
          npm run test:source-browser-fallback
          npm run test:source-limit-policy
          npm run test:source-future-only
          npm run test:source-cadence
          npm run test:source-selection-contract
          npm run test:incremental-build
          # 2026-09-03: a template change forced a full SEO restamp, so 3,388 sitemap
          # URLs shipped one identical <lastmod> and Google discounted the signal for
          # all of them. Rebuilding every page and declaring every page modified are
          # different things. Pure fixture, <1s.
          npm run test:sitemap-freshness
          npm run test:crawler-visible-content
          npm run test:singleton-injection
          npm run test:sync-freshness-watchdog
          npm run test:english-surface-lead
          npm run test:npm-audit-outcome
          npm run test:published-output-persistence
          npm run test:catalog-content-match
          npm run test:scega-events-extractor
          npm run test:informa-saudi-portfolio
          npm run test:scega-canonical-alias
          npm run test:kau-aseer-sources
          npm run test:poster-ocr
          npm run test:visit-saudi-image-identity
          npm run test:pdf-image-geometry
          npm run test:platinumlist-leads
          npm run test:platinumlist-detail-radar
          npm run test:regional-chamber-extractors
          # Program/workshop enrichment gates (2026-08-02): previously reachable only
          # through launch:source-gates -> launch:preflight, neither of which any CI
          # workflow invokes (launch:* batteries only ever appear in comments here).
          # These ran nowhere, so test:sfda-workshop-enrichment sat red against the
          # live catalog undetected. All 9 are fixture-based (read data/events_catalog.json
          # + dist/events.json + rendered dist HTML; no network calls in the test scripts
          # themselves) and run in ~2.6s combined, so they are wired here alongside the
          # other enrichment-gate cluster below. See scripts/enrich-sfda-workshop-details.mjs
          # for the root-cause fix that made test:sfda-workshop-enrichment green again.
          npm run test:tuwaiq-program-enrichment
          npm run test:future-skills-program-enrichment
          npm run test:sfda-workshop-enrichment
          npm run test:misk-program-enrichment
          # 2026-09-01: an enrichment writer read back its own generated summary and
          # re-appended the attribution sentence every run, welding Arabic chrome onto
          # English source prose until test:en-surface-sweep blocked the publish for
          # three days. Fixture-based, catalog-only, <1s.
          npm run test:source-attribution
          npm run test:dhahran-expo-enrichment
          npm run test:visit-saudi-enrichment
          npm run test:swa-enrichment
          npm run test:rfecc-enrichment
          npm run test:mdlbeast-enrichment
          npm run test:leap-agenda-enrichment
          npm run test:money2020-agenda-enrichment
          npm run test:hrse-agenda-enrichment
          npm run test:smart-data-agenda-enrichment
          npm run test:rff-agenda-enrichment
          npm run test:official-agenda-radar
          npm run test:global-proptech-agenda
          npm run test:backlog-target-selection
          npm run test:backlog-enrichment
          # Third-party publication volume/content can legitimately change; keep it visible without freezing sync.
          npm run test:content-volume-advisory || echo "CONTENT_VOLUME_DEBT (non-blocking)"
          npm run test:single-session-activation
          npm run test:live-operational-feeds
          npm run test:event-priority
          npm run test:home-month-calendar
          npm run test:multiday-card
          npm run test:event-page-reorg
          npm run test:attendance-mode-offline
          npm run test:venue-location
          npm run test:image-cache
          npm run test:public-assets
          npm run test:owner-surface-isolation
          npm run test:first-glance-trust
          # 2026-09-02: 23 public pages (the highest-intent SEO landing set) shipped
          # data-runtime-status hooks with no script to drive them — chips that looked
          # wired and were frozen at build time forever. Hooks without a driver is now
          # a banned class on every page. Reads dist/ only, <1s.
          npm run test:live-runtime-coverage
          # 2026-09-02 owner report: a multi-day event is stored as ONE unbroken
          # window, so "start <= now <= end" was as true at 23:00 as at 15:00 and the
          # site claimed the hour two hours after the day had closed. The claim now
          # has to be earned, and this holds the build rule and the client rule to
          # the same line. Fixture + catalog only, <1s.
          npm run test:live-claim-parity
          # 2026-09-03: 1,160 of 1,602 event pages (72%) described an event that had
          # already finished and NOT ONE said so in its <title> — 34,600 Google
          # impressions returned 444 clicks. A snippet may not claim a state the page
          # is not in. Reads dist/ only, <2s.
          npm run test:snippet-honesty
          # 2026-09-03: 1,175 finished event pages rendered a session chip reading
          # "قادمة", and 692 pages told the reader the page exists to serve search
          # engines. Reads dist/ only, <2s.
          npm run test:page-honesty
          # 2026-09-03: every event page linked to ZERO other event pages, leaving
          # 1,146 of 1,603 (71%) with no inbound internal link at all. Reads dist/
          # only, <2s.
          npm run test:internal-linking
          npm run test:mobile-browsing
          npm run test:i18n-contract
          npm run test:i18n-site
          npm run test:en-surface-sweep
          npm run test:mt-glossary
          npm run test:seo-structured-data
          npm run test:ticket-offers
          npm run test:seo-freshness
          npm run test:indexnow
          npm run test:ai-search-readiness
          npm run test:event-kind
          npm run test:city-search
          # 2026-09-02: dist/weekend.html shipped linked from the site-wide nav
          # and listed in sitemap.xml, but no generator wrote it — a frozen
          # static file from an older generator survived every rebuild since
          # dist/ is never wiped between builds (AGENTS.md law 5). Class ban,
          # not a weekend.html-specific check: any dist-root page that is
          # linked or sitemapped but wasn't touched by THIS build is a frozen
          # artifact. See scripts/generator-coverage-regression-test.mjs.
          npm run test:generator-coverage

      - name: Site gates CI battery (gates previously wired into no CI battery, ~35s)
        # Root cause: these 30 launch:site-gates checks (test:home-data through
        # test:site-launch-sweep, see package.json's ci:site-gates script) had
        # never been wired into any CI workflow, so regressions in them (e.g.
        # the stale organizers/home-data assertions healed in this PR) rotted
        # silently until someone ran `npm run launch:preflight` by hand.
        # Measured at ~35s total against the ~20-minute sync — negligible.
        run: npm run ci:site-gates

      - name: Prelaunch data quality gate (non-blocking content-state debt)
        # test:prelaunch-data-quality is excluded from ci:site-gates because it
        # is content-state-dependent: a single weak summary or stale audience
        # tag introduced by any source would redden every sync run, even
        # though it is real (owner-reportable) content debt rather than a
        # code regression. Ruling: surface offenders in the log without
        # failing the sync, so the debt is visible without adding pipeline
        # noise. See scripts/prelaunch-data-quality-regression-test.mjs.
        run: npm run test:prelaunch-data-quality || echo "PRELAUNCH_DATA_QUALITY_DEBT (non-blocking)"

      - name: Publish quality gates battery (loud, non-blocking — shared with deploy.yml, see package.json ci:publish-quality-gates)
        # Governance fix 2026-08-02: deploy.yml ("EventLive MVP Pipeline") is
        # the official gated pipeline and runs this exact battery blocking.
        # This workflow used to skip all ~40 of these checks entirely
        # (including audit:axe/test:axe and audit:lighthouse), so deploy.yml
        # sat red for 5 days (2026-07-28 onward) while this workflow kept
        # publishing every few hours through a narrower, drifted gate list —
        # a critical accessibility violation shipped and stayed live because
        # nothing that actually published ever looked at it (Invariant A/B,
        # see GATES-GOVERNANCE.md). It now runs the identical battery here
        # too, but non-blocking: this project already survived an 8-day sync
        # outage once, and freezing publishing over a quality regression is
        # a worse failure than shipping a known one loudly (Invariant C). A
        # failure here does NOT stop the sync — the next step turns it into
        # a loud ::error:: and $GITHUB_STEP_SUMMARY section instead of
        # failing silent.
        id: publish_quality_gates
        continue-on-error: true
        run: npm run ci:publish-quality-gates

      - name: Report publish quality gates result (loud on failure, never blocking)
        # Same class ban as the final step below: 'skipped' is not 'failed'. When
        # an earlier blocking step aborts the job, this battery never runs, and
        # reporting that it "failed ... the site still deployed" described a run
        # that never reached the deploy at all.
        if: always()
        env:
          QUALITY_GATES_OUTCOME: ${{ steps.publish_quality_gates.outcome }}
        run: |
          if [ "$QUALITY_GATES_OUTCOME" = "success" ]; then
            echo "PUBLISH_QUALITY_GATES_OK"
          elif [ "$QUALITY_GATES_OUTCOME" = "skipped" ]; then
            echo "::error::PUBLISH_QUALITY_GATES_NEVER_RAN the shared publish-quality battery was skipped because an earlier blocking step already failed this job. The site did NOT publish this run — see the final step for the outage report."
            {
              echo "## 🛑 PUBLISH QUALITY GATES NEVER RAN"
              echo "- An earlier blocking step failed, so the battery (and the deploy) were skipped."
              echo "- Do not read this as a quality regression: nothing was published this run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::PUBLISH_QUALITY_GATES_RED the shared publish-quality battery (npm run ci:publish-quality-gates) failed in this sync run. The site still deployed (loud-but-non-blocking by design, see GATES-GOVERNANCE.md) but this needs attention — check the 'Publish quality gates battery' step log above for which check(s) failed."
            {
              echo "## ⚠️ PUBLISH QUALITY GATES FAILED (non-blocking)"
              echo "- \`npm run ci:publish-quality-gates\` failed in this run."
              echo "- The sync still published anyway (Invariant C: never freeze the content pipeline)."
              echo "- See the 'Publish quality gates battery' step log above for the failing check(s)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Autonomous surface-debt alerting (self-maintained GitHub issue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/report-surface-debt-issue.mjs

      - name: Autonomous chronic-collector alerting (self-maintained GitHub issue)
        # Placed after the publish-quality battery, which is where
        # owner:command-center regenerates reports/source-harvest-os-status.json —
        # so this reads THIS run's collector outcomes, not a carried-over verdict.
        # Same contract as the sibling step above: it never fails the sync (these
        # are third-party websites; freezing publishing over them would violate
        # Invariant C) and it never lets the rot go unseen either.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/report-chronic-source-issue.mjs

      - name: Persist sync state back to the repository
        run: |
          git config user.name "eventme-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            data/events_catalog.json \
            data/content_translations.json \
            data/source_candidates.json \
            data/source_ended_events.json \
            data/source_registry.json \
            data/source_run_state.json \
            data/source_growth_state.json \
            data/seo_page_state.json \
            data/published_url_ledger.json \
            data/event_image_cache_manifest.json \
            reports/source-*.json \
            reports/source-*.md \
            reports/mygov-*.json \
            reports/mygov-*.md \
            reports/platinumlist-*.json \
            reports/platinumlist-*.md \
            reports/event-image-cache-report.json \
            reports/event-image-cache-report.md \
            reports/visit-saudi-image-identity-report.json \
            reports/visit-saudi-image-identity-report.md \
            reports/*-enrichment-report.json \
            reports/*-enrichment-report.md \
            reports/official-single-session-activation-report.json \
            reports/official-single-session-activation-report.md \
            reports/eye-official-link-verification-report.json \
            reports/eye-official-link-verification-report.md \
            reports/i18n-en-surface.json
          if git diff --cached --quiet; then
            echo "No catalog state changes to persist."
          else
            git commit -m "chore(sync): persist daily source sync state [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase --autostash "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              echo "Sync push raced with another deployment; retrying (${attempt}/3)."
              sleep $((attempt * 5))
            done
            echo "Unable to persist sync state after three rebased attempts."
            exit 1
          fi

      - name: Upload source sync evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eventme-source-sync-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            reports/source-*.md
            reports/source-*.json
            reports/source-*.html
            reports/mygov-*.md
            reports/mygov-*.json
            reports/platinumlist-*.md
            reports/platinumlist-*.json
            reports/incremental-build-report.md
            reports/incremental-build-report.json
            data/raw/mygov-wayback-radar/**
            data/raw/platinumlist-platform-radar/**
            data/raw/platinumlist-detail-radar/**
            data/raw/source-snapshots/**
            data/raw/source-yield-snapshots/**
            data/source_candidates.json
            data/source_run_state.json
            data/source_growth_state.json
            data/events_catalog.json
            data/event_image_cache_manifest.json
            .eventlive-cache/indexnow-delta.json
            reports/production-pipeline-health.json
            dist/**

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify search engines about changed URLs
        continue-on-error: true
        run: npm run seo:indexnow

      - name: Upload IndexNow submission receipt
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: eventme-indexnow-receipt-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: reports/indexnow-submission-receipt.json

      - name: Production pipeline health check (Invariant A — official deploy.yml red must never be silent)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-pipeline-health-check.mjs

      - name: Summary
        run: |
          echo "## EventLive Source Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site: https://eventme.live/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source ops: reports/source-ops-report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source growth: reports/source-growth-report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/incremental-build-report.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat reports/incremental-build-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail the RUN if the site did not publish, or if publish quality gates failed
        # PM correction 2026-08-02: continue-on-error on the battery step plus
        # an ::error:: annotation still lets GitHub record this job as
        # SUCCESS — a green run with an annotation nobody opens is exactly
        # the silent-red failure mode this whole fix exists to close.
        # Positioned deliberately last (after Pages deploy and after the
        # production-pipeline health check above): publishing has already
        # happened by the time this step runs, so Invariant C holds — the
        # content pipeline never freezes — while the run itself now lands
        # red in the Actions list where a human actually sees it, instead of
        # depending on someone opening a green run to find the annotation.
        #
        # Class ban for syncs 30920399222 / 31016172861 / 31041912300 / 31069254407:
        # this step used to look ONLY at publish_quality_gates and unconditionally
        # announce "the site DID publish this run ... NOT a publishing outage".
        # But an earlier blocking step (Regression checks, Site gates) aborts the
        # job before the deploy, which leaves publish_quality_gates SKIPPED — and
        # "skipped" != "success", so the outage branch printed the published-fine
        # message. Four runs reported themselves as cosmetic quality regressions
        # while eventme.live sat frozen for ~20 hours. A gauge that reads "all
        # good" while the factory is stopped is worse than no gauge: it converts
        # an outage into something nobody opens. The step now reads the DEPLOY
        # outcome first and names the real failure mode.
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          QUALITY_GATES_OUTCOME: ${{ steps.publish_quality_gates.outcome }}
        run: |
          if [ "$DEPLOY_OUTCOME" != "success" ]; then
            echo "::error::SYNC_RUN_RED_PUBLISHING_OUTAGE the site did NOT publish this run (Deploy to GitHub Pages outcome=${DEPLOY_OUTCOME}). eventme.live is still serving the PREVIOUS build and goes staler with every run that ends this way. This is a publishing outage, NOT a quality regression: an earlier blocking step aborted the job before the deploy. Find the first red step above and fix that."
            {
              echo "## 🛑 PUBLISHING OUTAGE — the site did NOT publish"
              echo "- \`Deploy to GitHub Pages\` outcome: \`${DEPLOY_OUTCOME}\`."
              echo "- \`Publish quality gates battery\` outcome: \`${QUALITY_GATES_OUTCOME}\`."
              echo "- eventme.live is still serving the previous build — content is going stale."
              echo "- Catalog sync state was NOT persisted either (that step sits before the deploy)."
              echo "- Fix the first red step above; this is not a cosmetic gate failure."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$QUALITY_GATES_OUTCOME" != "success" ]; then
            echo "::error::SYNC_RUN_RED_SITE_ALREADY_PUBLISHED the site DID publish this run — this run is marked red on purpose because the shared publish-quality battery (npm run ci:publish-quality-gates) failed; this is a quality regression, NOT a publishing outage. See the 'Publish quality gates battery' step log above for which check(s) failed."
            exit 1
          fi
          if [ -f .eventlive-cache/source-health-nonblocking-finding.txt ]; then
            echo "::error::SYNC_RUN_RED_SITE_ALREADY_PUBLISHED the site DID publish this run — it is red because the source-health gate found a PARTIAL loss of published output. See SOURCE_HEALTH_NONBLOCKING_FINDING above for the named records. A total loss would have blocked the publish; a partial one is a defect to fix, not a reason to freeze the site (Invariant C)."
            {
              echo "## ⚠️ PARTIAL PUBLISHED-OUTPUT LOSS (site still published)"
